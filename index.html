<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Riddle Diary</title>
    <link rel="preload" href="/assets/fonts/Tangerine-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/assets/fonts/LongCang-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/assets/fonts/WangHanZong-ZhongXingShu.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/assets/fonts/MuYao-SuiXin.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face {
        font-family: "Tangerine";
        src: url("/assets/fonts/Tangerine-Bold.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Tangerine";
        src: url("/assets/fonts/Tangerine-Bold.ttf") format("truetype");
        font-weight: bold;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Long Cang";
        src: url("/assets/fonts/LongCang-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "WangHanZong-ZhongXingShu";
        src: url("/assets/fonts/WangHanZong-ZhongXingShu.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "MuYao-SuiXin";
        src: url("/assets/fonts/MuYao-SuiXin.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas { display: block; }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, transparent 62%, rgba(12, 6, 4, 0.22) 88%, rgba(5, 2, 1, 0.55) 100%);
        z-index: 10;
      }

      :root {
        --ink-color: #24180f;
      }

      /* 原位透明 input：捕获全键盘与中文 IME 输入 */
      .ink-hidden-input {
        position: fixed;
        left: 0;
        top: 0;
        opacity: 0;
        width: 1px;
        height: 28px;
        padding: 0;
        margin: 0;
        border: none;
        outline: none;
        background: transparent;
        caret-color: transparent;
        color: transparent;
        pointer-events: none;
        z-index: 25;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
